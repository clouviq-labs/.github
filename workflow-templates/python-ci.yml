name: Python CI
on:
  push:
    branches: [$default-branch]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    uses: clouviq-labs/shared-workflows/.github/workflows/python-lint.yml@9eef0206aafbe6e6563ba52285fefe0649de6b57 # v2
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: clouviq-labs/shared-workflows/setup-app@9eef0206aafbe6e6563ba52285fefe0649de6b57 # v2
      - run: pytest -q
